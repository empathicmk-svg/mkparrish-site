<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-label="Custom neon wall art online ordering flow">
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <filter id="pinkGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="whiteGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#wall)"/>
  <rect x="130" y="120" width="2140" height="1360" rx="42" fill="#0b0b0f" stroke="#737782" stroke-opacity="0.3" stroke-width="2"/>
  <text x="1200" y="300" font-family="'Bebas Neue', 'Arial Narrow', Arial, sans-serif" font-size="156" font-weight="700" text-anchor="middle" letter-spacing="10" fill="#ffd7ed" filter="url(#pinkGlow)">CUSTOM NEON</text>
  <text x="1200" y="410" font-family="'Playfair Display', Georgia, serif" font-size="86" font-weight="700" text-anchor="middle" fill="#fff7fb" filter="url(#whiteGlow)">your words, made luminous</text>
  <g transform="translate(270 590)">
    
        <g transform="translate(0 0)">
          <rect width="390" height="520" rx="28" fill="#15151b" stroke="#737782" stroke-opacity="0.38"/>
          <circle cx="70" cy="78" r="34" fill="none" stroke="#ff5cac" stroke-width="5" filter="url(#pinkGlow)"/>
          <text x="70" y="90" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" text-anchor="middle" fill="#fff7fb">01</text>
          <text x="42" y="178" font-family="'Bebas Neue', 'Arial Narrow', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="3" fill="#ffd7ed"><tspan x="42" dy="0">Pick a line</tspan></text>
          <text x="42" y="312" font-family="'DM Sans', Arial, sans-serif" font-size="34" font-weight="300" fill="#b8bbc4"><tspan x="42" dy="0">Quote, vow, name,</tspan><tspan x="42" dy="48">lyric-length phrase.</tspan></text>
          <line x1="42" x2="348" y1="440" y2="440" stroke="#ff5cac" stroke-width="4" opacity="0.8" filter="url(#pinkGlow)"/>
        </g>
        <g transform="translate(470 0)">
          <rect width="390" height="520" rx="28" fill="#15151b" stroke="#737782" stroke-opacity="0.38"/>
          <circle cx="70" cy="78" r="34" fill="none" stroke="#ff5cac" stroke-width="5" filter="url(#pinkGlow)"/>
          <text x="70" y="90" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" text-anchor="middle" fill="#fff7fb">02</text>
          <text x="42" y="178" font-family="'Bebas Neue', 'Arial Narrow', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="3" fill="#ffd7ed"><tspan x="42" dy="0">Choose the</tspan><tspan x="42" dy="62">glow</tspan></text>
          <text x="42" y="312" font-family="'DM Sans', Arial, sans-serif" font-size="34" font-weight="300" fill="#b8bbc4"><tspan x="42" dy="0">Pink, soft white, smoke</tspan><tspan x="42" dy="48">gray, or mixed.</tspan></text>
          <line x1="42" x2="348" y1="440" y2="440" stroke="#fff7fb" stroke-width="4" opacity="0.8" filter="url(#whiteGlow)"/>
        </g>
        <g transform="translate(940 0)">
          <rect width="390" height="520" rx="28" fill="#15151b" stroke="#737782" stroke-opacity="0.38"/>
          <circle cx="70" cy="78" r="34" fill="none" stroke="#ff5cac" stroke-width="5" filter="url(#pinkGlow)"/>
          <text x="70" y="90" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" text-anchor="middle" fill="#fff7fb">03</text>
          <text x="42" y="178" font-family="'Bebas Neue', 'Arial Narrow', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="3" fill="#ffd7ed"><tspan x="42" dy="0">Approve proof</tspan></text>
          <text x="42" y="312" font-family="'DM Sans', Arial, sans-serif" font-size="34" font-weight="300" fill="#b8bbc4"><tspan x="42" dy="0">A digital mockup before</tspan><tspan x="42" dy="48">production.</tspan></text>
          <line x1="42" x2="348" y1="440" y2="440" stroke="#ff5cac" stroke-width="4" opacity="0.8" filter="url(#pinkGlow)"/>
        </g>
        <g transform="translate(1410 0)">
          <rect width="390" height="520" rx="28" fill="#15151b" stroke="#737782" stroke-opacity="0.38"/>
          <circle cx="70" cy="78" r="34" fill="none" stroke="#ff5cac" stroke-width="5" filter="url(#pinkGlow)"/>
          <text x="70" y="90" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" text-anchor="middle" fill="#fff7fb">04</text>
          <text x="42" y="178" font-family="'Bebas Neue', 'Arial Narrow', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="3" fill="#ffd7ed"><tspan x="42" dy="0">Hang it</tspan></text>
          <text x="42" y="312" font-family="'DM Sans', Arial, sans-serif" font-size="34" font-weight="300" fill="#b8bbc4"><tspan x="42" dy="0">Made as wall art, not a</tspan><tspan x="42" dy="48">generic sign.</tspan></text>
          <line x1="42" x2="348" y1="440" y2="440" stroke="#fff7fb" stroke-width="4" opacity="0.8" filter="url(#whiteGlow)"/>
        </g>
  </g>
  <text x="1200" y="1350" font-family="'DM Sans', Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle" letter-spacing="8" fill="#b8bbc4">PINK · WHITE · SMOKE GRAY</text>
</svg>