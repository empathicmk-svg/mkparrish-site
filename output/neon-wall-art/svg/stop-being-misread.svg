<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 2000 2000" role="img" aria-label="Stop being misread. neon wall art mockup">
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#121216"/>
      <stop offset="0.48" stop-color="#1d1d23"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="pinkWash" cx="50%" cy="44%" r="58%">
      <stop offset="0" stop-color="#ff5cac" stop-opacity="0.25"/>
      <stop offset="0.46" stop-color="#ff2f99" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07070a" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>
    <filter id="glowMax" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowWide" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowTight" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#wall)"/>
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.35"/>
  <rect width="100%" height="100%" fill="url(#pinkWash)"/>
  <g opacity="0.2">
    <line x1="0" x2="2000" y1="0" y2="0" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="125" y2="125" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="250" y2="250" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="375" y2="375" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="500" y2="500" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="625" y2="625" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="750" y2="750" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="875" y2="875" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="1000" y2="1000" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="1125" y2="1125" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="1250" y2="1250" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="1375" y2="1375" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="1500" y2="1500" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="1625" y2="1625" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="1750" y2="1750" stroke="#737782" stroke-width="1"/><line x1="0" x2="2000" y1="1875" y2="1875" stroke="#737782" stroke-width="1"/>
  </g>
  <rect x="180" y="180" width="1640" height="1640" rx="34" fill="#09090c" opacity="0.58" stroke="#737782" stroke-opacity="0.28" stroke-width="2"/>
  <rect x="198" y="198" width="1604" height="1604" rx="24" fill="none" stroke="#fff7fb" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="228" cy="228" r="12" fill="#b8bbc4" opacity="0.42"/>
  <circle cx="1772" cy="228" r="12" fill="#b8bbc4" opacity="0.42"/>
  <circle cx="228" cy="1772" r="12" fill="#b8bbc4" opacity="0.42"/>
  <circle cx="1772" cy="1772" r="12" fill="#b8bbc4" opacity="0.42"/>
  
    <g font-family="'Bebas Neue', 'Anton', 'Arial Narrow', Arial, sans-serif" font-size="240" font-weight="700"  text-anchor="middle" letter-spacing="8">
      <text x="1000" y="846" fill="none" stroke="#ff2f99" stroke-width="20" stroke-linejoin="round" opacity="0.28" filter="url(#glowMax)"><tspan x="1000" dy="0">STOP</tspan><tspan x="1000" dy="221">BEING</tspan><tspan x="1000" dy="221">MISREAD</tspan></text>
      <text x="1000" y="846" fill="none" stroke="#ff5cac" stroke-width="12" stroke-linejoin="round" opacity="0.55" filter="url(#glowWide)"><tspan x="1000" dy="0">STOP</tspan><tspan x="1000" dy="221">BEING</tspan><tspan x="1000" dy="221">MISREAD</tspan></text>
      <text x="1000" y="846" fill="none" stroke="#ffd7ed" stroke-width="5" stroke-linejoin="round" opacity="0.92" filter="url(#glowTight)"><tspan x="1000" dy="0">STOP</tspan><tspan x="1000" dy="221">BEING</tspan><tspan x="1000" dy="221">MISREAD</tspan></text>
      <text x="1000" y="846" fill="#fff7fb" stroke="#fff7fb" stroke-width="1.5" paint-order="stroke" opacity="0.98"><tspan x="1000" dy="0">STOP</tspan><tspan x="1000" dy="221">BEING</tspan><tspan x="1000" dy="221">MISREAD</tspan></text>
    </g>
  <line x1="480" x2="1520" y1="1623" y2="1623" stroke="#ff5cac" stroke-width="3" opacity="0.65" filter="url(#glowTight)"/>
  <text x="1000" y="1681" font-family="'DM Sans', Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="8" fill="#b8bbc4" opacity="0.82">QUOTE WALL ART</text>
  <text x="1000" y="1735" font-family="'DM Sans', Arial, sans-serif" font-size="36" font-weight="300" text-anchor="middle" fill="#fff7fb" opacity="0.76">Sharp brand voice neon wall art</text>
</svg>