<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400" role="img" aria-label="I am the author. I always have been. neon wall art mockup">
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#121216"/>
      <stop offset="0.48" stop-color="#1d1d23"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="pinkWash" cx="50%" cy="44%" r="58%">
      <stop offset="0" stop-color="#ff5cac" stop-opacity="0.25"/>
      <stop offset="0.46" stop-color="#ff2f99" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07070a" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>
    <filter id="glowMax" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowWide" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowTight" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#wall)"/>
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.35"/>
  <rect width="100%" height="100%" fill="url(#pinkWash)"/>
  <g opacity="0.2">
    <line x1="0" x2="1800" y1="0" y2="0" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="150" y2="150" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="300" y2="300" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="450" y2="450" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="600" y2="600" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="750" y2="750" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="900" y2="900" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="1050" y2="1050" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="1200" y2="1200" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="1350" y2="1350" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="1500" y2="1500" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="1650" y2="1650" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="1800" y2="1800" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="1950" y2="1950" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="2100" y2="2100" stroke="#737782" stroke-width="1"/><line x1="0" x2="1800" y1="2250" y2="2250" stroke="#737782" stroke-width="1"/>
  </g>
  <rect x="162" y="162" width="1476" height="2076" rx="34" fill="#09090c" opacity="0.58" stroke="#737782" stroke-opacity="0.28" stroke-width="2"/>
  <rect x="180" y="180" width="1440" height="2040" rx="24" fill="none" stroke="#fff7fb" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="210" cy="210" r="12" fill="#b8bbc4" opacity="0.42"/>
  <circle cx="1590" cy="210" r="12" fill="#b8bbc4" opacity="0.42"/>
  <circle cx="210" cy="2190" r="12" fill="#b8bbc4" opacity="0.42"/>
  <circle cx="1590" cy="2190" r="12" fill="#b8bbc4" opacity="0.42"/>
  
    <g font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="205" font-weight="700" font-style="italic" text-anchor="middle" letter-spacing="0">
      <text x="900" y="926" fill="none" stroke="#ff2f99" stroke-width="20" stroke-linejoin="round" opacity="0.28" filter="url(#glowMax)"><tspan x="900" dy="0">I am the</tspan><tspan x="900" dy="221">author.</tspan><tspan x="900" dy="221">I always</tspan><tspan x="900" dy="221">have been.</tspan></text>
      <text x="900" y="926" fill="none" stroke="#ff5cac" stroke-width="12" stroke-linejoin="round" opacity="0.55" filter="url(#glowWide)"><tspan x="900" dy="0">I am the</tspan><tspan x="900" dy="221">author.</tspan><tspan x="900" dy="221">I always</tspan><tspan x="900" dy="221">have been.</tspan></text>
      <text x="900" y="926" fill="none" stroke="#ffd7ed" stroke-width="5" stroke-linejoin="round" opacity="0.92" filter="url(#glowTight)"><tspan x="900" dy="0">I am the</tspan><tspan x="900" dy="221">author.</tspan><tspan x="900" dy="221">I always</tspan><tspan x="900" dy="221">have been.</tspan></text>
      <text x="900" y="926" fill="#ffd7ed" stroke="#fff7fb" stroke-width="1.5" paint-order="stroke" opacity="0.98"><tspan x="900" dy="0">I am the</tspan><tspan x="900" dy="221">author.</tspan><tspan x="900" dy="221">I always</tspan><tspan x="900" dy="221">have been.</tspan></text>
    </g>
  <line x1="432" x2="1368" y1="1989" y2="1989" stroke="#ff5cac" stroke-width="3" opacity="0.65" filter="url(#glowTight)"/>
  <text x="900" y="2047" font-family="'DM Sans', Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="8" fill="#b8bbc4" opacity="0.82">QUOTE WALL ART</text>
  <text x="900" y="2101" font-family="'DM Sans', Arial, sans-serif" font-size="36" font-weight="300" text-anchor="middle" fill="#fff7fb" opacity="0.76">Script neon line from The Rewrite</text>
</svg>