<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@1,600;1,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --void: #080808;
    --white: #FAFAF8;
    --blush: #FFE0EC;
    --petal: #FFB5D0;
    --rose: #F58CAD;
    --carmine: #D94F7C;
    --lipstick: #B43259;
  }

  body {
    width: 1584px;
    height: 396px;
    overflow: hidden;
    background: var(--lipstick);
    font-family: "DM Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .banner {
    width: 1584px;
    height: 396px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(112deg, #9E2149 0%, var(--lipstick) 18%, var(--carmine) 46%, var(--rose) 74%, var(--petal) 100%);
  }

  /* ── Light & texture ── */
  .glow-a {
    position: absolute;
    right: -160px;
    top: -260px;
    width: 760px;
    height: 760px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,236,244,0.75) 0%, rgba(255,224,236,0) 62%);
  }
  .glow-b {
    position: absolute;
    left: 360px;
    bottom: -380px;
    width: 720px;
    height: 720px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,181,208,0.45) 0%, rgba(255,181,208,0) 60%);
  }
  .rings {
    position: absolute;
    left: -120px;
    top: -170px;
    width: 640px;
    height: 640px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.18);
    box-shadow: 0 0 0 70px rgba(255,255,255,0.035), 0 0 0 71.5px rgba(255,255,255,0.14), 0 0 0 150px rgba(255,255,255,0.025), 0 0 0 151.5px rgba(255,255,255,0.1);
  }
  .grain {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 6px 6px;
    mix-blend-mode: soft-light;
  }

  /* Big ghosted monogram behind the profile-photo area */
  .monogram {
    position: absolute;
    left: 40px;
    top: -34px;
    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: 420px;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 2px rgba(255,255,255,0.16);
    letter-spacing: -0.02em;
  }

  /* ── Content (kept right of LinkedIn's profile-photo overlap) ── */
  .content {
    position: absolute;
    left: 540px;
    right: 72px;
    top: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .eyebrow {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--white);
    background: var(--void);
    padding: 8px 16px 8px 14px;
    border-radius: 999px;
  }
  .eyebrow i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--petal);
    box-shadow: 0 0 10px var(--petal);
  }

  .headline {
    margin-top: 16px;
    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: 84px;
    line-height: 0.9;
    letter-spacing: 0.005em;
    color: var(--white);
    text-shadow: 0 2px 24px rgba(120, 18, 52, 0.35);
  }
  .headline span { color: var(--void); }

  .script {
    margin-top: 10px;
    font-family: "Playfair Display", Georgia, serif;
    font-style: italic;
    font-weight: 700;
    font-size: 25px;
    color: var(--void);
  }

  .row {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .stat {
    background: rgba(255,255,255,0.86);
    border-radius: 14px;
    padding: 9px 16px 8px;
    box-shadow: 0 6px 18px rgba(120, 18, 52, 0.18);
  }
  .stat b {
    display: block;
    font-family: "Bebas Neue", Impact, sans-serif;
    font-weight: 400;
    font-size: 30px;
    line-height: 1;
    color: var(--lipstick);
  }
  .stat span {
    display: block;
    margin-top: 2px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #3a3a3a;
  }

  .cta {
    margin-left: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--void);
    color: var(--white);
    border-radius: 14px;
    padding: 14px 20px;
    box-shadow: 0 8px 22px rgba(8,8,8,0.28);
  }
  .cta small {
    display: block;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--petal);
  }
  .cta strong {
    display: block;
    margin-top: 2px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .cta .arrow {
    font-size: 22px;
    color: var(--petal);
    margin-left: 4px;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="rings"></div>
  <div class="monogram">MK</div>
  <div class="grain"></div>

  <div class="content">
    <div class="eyebrow"><i></i>Marketing Manager · Brand, Retail &amp; Partner Growth</div>
    <h1 class="headline">I turn trusted brands into<br/><span>products people buy.</span></h1>
    <p class="script">Strategy is only worth something once it&rsquo;s in market.</p>
    <div class="row">
      <div class="stat"><b>$200M+</b><span>Partner revenue</span></div>
      <div class="stat"><b>80M+</b><span>Monthly viewers</span></div>
      <div class="stat"><b>$20M+</b><span>Retail revenue</span></div>
      <div class="stat"><b>$40M+</b><span>Pipeline</span></div>
      <div class="cta">
        <div><small>Work with me</small><strong>mkparrish.com</strong></div>
        <span class="arrow">→</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
